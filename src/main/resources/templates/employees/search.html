<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Search Employees</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .search-form {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        label {
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .result-info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #004085;
            border-left: 4px solid #667eea;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        
        tbody tr {
            transition: background 0.3s;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${pageTitle}">🔍 Search Employees</h1>
        
        <!-- Search Form -->
        <div class="search-form">
            <form action="/employees/search/results" method="get">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Search by Name</label>
                        <input type="text" 
                               id="name" 
                               name="name" 
                               placeholder="Enter employee name"
                               th:value="${param.name}">
                    </div>
                    
                    <div class="form-group">
                        <label for="department">Search by Department</label>
                        <input type="text" 
                               id="department" 
                               name="department" 
                               placeholder="Enter department name"
                               th:value="${param.department}">
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">🔍 Search</button>
                    <a href="/employees/search" class="btn btn-secondary">🔄 Reset</a>
                    <a href="/employees/list" class="btn btn-secondary">⬅️ Back to List</a>
                </div>
            </form>
        </div>
        
        <!-- Search Results -->
        <div th:if="${employees != null}">
            <div class="result-info" th:if="${searchInfo}">
                <strong th:text="${searchInfo}">Search results</strong>
                <span th:text="' - Found ' + ${resultCount} + ' employee(s)'"></span>
            </div>
            
            <!-- Results Table -->
            <table th:if="${!employees.empty}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="employee : ${employees}">
                        <td th:text="${employee.id}">1</td>
                        <td th:text="${employee.name}">John Doe</td>
                        <td th:text="${employee.email}">john@example.com</td>
                        <td th:text="${employee.department != null ? employee.department.name : 'N/A'}">IT</td>
                    </tr>
                </tbody>
            </table>
            
            <!-- No Results Message -->
            <div class="no-results" th:if="${employees.empty}">
                <p>😕 No employees found matching your search criteria.</p>
                <p style="margin-top: 10px; font-size: 14px;">Try different search terms or reset the search.</p>
            </div>
        </div>
    </div>
</body>
</html>
